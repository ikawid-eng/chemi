<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700&amp;display=swap');
      .brand-title {
        font-family: 'Cormorant Garamond', 'Playfair Display', Georgia, serif;
        font-weight: 700;
        font-size: 148px;
        fill: #FAF7F2;
        text-anchor: middle;
      }
      .brand-sub {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: 32px;
        letter-spacing: 4px;
        fill: #FAF7F2;
        text-anchor: middle;
        opacity: 0.95;
      }
    </style>
  </defs>
  <!-- Background maroon square with smooth corners -->
  <rect width="512" height="512" rx="96" fill="#581C25"/>
  <!-- Chemi Logo Text -->
  <g transform="translate(0, 10)">
    <text x="256" y="275" class="brand-title">Chemi</text>
    <text x="256" y="340" class="brand-sub">Handmade Jewellery</text>
  </g>
</svg>
